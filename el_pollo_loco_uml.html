<svg viewBox="0 0 1100 1420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>El Pollo Loco UML Class Diagram</title>
<desc>UML class diagram showing the inheritance hierarchy and associations of El Pollo Loco game classes</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M1 1L9 5L1 9Z" fill="var(--fill-inh)" stroke="none"/>
  </marker>
  <marker id="tri-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M1 1L9 5L1 9Z" fill="var(--fill-inh)" stroke="none"/>
  </marker>
  <style>
    :root {
      --bg-class: #f1f0fc;
      --border-class: #7f77dd;
      --text-class: #26215c;
      --bg-head: #7f77dd;
      --text-head: #fff;
      --bg-util: #e1f5ee;
      --border-util: #1d9e75;
      --text-util: #04342c;
      --bg-head-util: #1d9e75;
      --bg-data: #faeeda;
      --border-data: #ba7517;
      --text-data: #412402;
      --bg-head-data: #ba7517;
      --fill-inh: #7f77dd;
      --line: #888780;
      --assoc: #3B8BD4;
      --method: #3c3489;
      --divider: #b4b2a9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-class: #26215c;
        --border-class: #afa9ec;
        --text-class: #eeedfe;
        --bg-head: #3c3489;
        --text-head: #eeedfe;
        --bg-util: #04342c;
        --border-util: #5dcaa5;
        --text-util: #e1f5ee;
        --bg-head-util: #0f6e56;
        --bg-data: #412402;
        --border-data: #ef9f27;
        --text-data: #faeeda;
        --bg-head-data: #854f0b;
        --fill-inh: #afa9ec;
        --line: #b4b2a9;
        --assoc: #85b7eb;
        --method: #cecbf6;
        --divider: #3c3489;
      }
    }
    .cls rect { stroke-width: 0.5; }
    .head { font-size: 13px; font-weight: 600; }
    .method { font-size: 11px; fill: var(--method); }
    .lbl { font-size: 10px; fill: var(--line); }
    .inh { stroke: var(--fill-inh); stroke-width: 1.5; fill: none; marker-end: url(#tri); }
    .assoc { stroke: var(--assoc); stroke-width: 1; fill: none; stroke-dasharray: 5 3; marker-end: url(#arrow); }
    .box-cls { fill: var(--bg-class); stroke: var(--border-class); }
    .box-util { fill: var(--bg-util); stroke: var(--border-util); }
    .box-data { fill: var(--bg-data); stroke: var(--border-data); }
    .hd-cls { fill: var(--bg-head); }
    .hd-util { fill: var(--bg-head-util); }
    .hd-data { fill: var(--bg-head-data); }
    .t-head { fill: var(--text-head); font-size: 13px; font-weight: 600; }
    .t-cls { fill: var(--text-class); }
    .t-util { fill: var(--text-util); }
    .t-data { fill: var(--text-data); }
    .divider { stroke: var(--divider); stroke-width: 0.5; }
  </style>
</defs>
